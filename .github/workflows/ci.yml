name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/portfolio/frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: src/portfolio/frontend
        run: npm ci --ignore-scripts
      - name: Test frontend
        working-directory: src/portfolio/frontend
        run: npm test
      - name: Build frontend
        working-directory: src/portfolio/frontend
        run: npm run build
      - name: Verify tracked frontend build
        run: git diff --exit-code -- src/portfolio/web_assets
      - uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          channels: conda-forge
          activate-environment: investment-system-ci
          python-version: "3.11"
      - name: Install test dependencies
        run: conda install -y pytest pyyaml pandas pypdf jsonschema
      - name: Compile Python files
        run: python -m py_compile $(git ls-files '*.py')
      - name: Validate source routes and operational adapters
        run: python scripts/run_source_route_quality_gate.py --import-check --output reports/quality/ci_source_route_quality_report.yaml
      - name: Validate active routing retirement
        run: python -m pytest -q tests/test_r5_v1_active_routing_retirement.py
      - name: Run pytest
        run: python -m pytest -q
