score_scale:
  min: 0
  max: 5
  interpretation:
    0: evidence_supported_very_weak
    1: weak
    2: early_or_uncertain
    3: moderate
    4: strong
    5: very_strong_with_high_quality_evidence

score_semantics:
  unscored_value: null
  placeholder_evidence_prefixes:
    - TODO
    - MISSING
    - LOW_CONFIDENCE
    - UNVERIFIED
    - NOT_APPLICABLE
  numeric_score_type: analyst_judgment
  unscored_score_type: unscored
  aggregate_scores: false
  priority_type: research_priority
  priority_basis: analyst_judgment_not_score_aggregation

frameworks:
  segment_scorecard:
    description: 细分方向研究评分框架；数字是有证据边界的分析者判断，未评分维度保持 null，不求总分且不是交易信号。
    dimensions:
      - market_space
      - growth_visibility
      - industry_chain_position
      - profit_pool_quality
      - a_share_purity
      - evidence_quality
      - catalyst_visibility
      - risk_pressure
    required_fields:
      - segment_id
      - report_date
      - scores
      - final_priority
      - final_priority_type
      - priority_basis
    score_entry_required_fields:
      - score
      - score_type
      - rationale
      - evidence_ids
      - confidence
  stock_scorecard:
    description: 个股研究评分框架；数字是有证据边界的分析者判断，未评分维度保持 null，不求总分且不输出买卖建议。
    dimensions:
      - segment_exposure_quality
      - revenue_visibility
      - margin_quality
      - customer_quality
      - technology_or_product_edge
      - financial_quality
      - governance_quality
      - valuation_scenario_risk
      - evidence_quality
    required_fields:
      - company_id
      - stock_code
      - score_date
      - scores
      - final_priority
      - final_priority_type
      - priority_basis
    score_entry_required_fields:
      - score
      - score_type
      - rationale
      - evidence_ids
      - confidence
  comparison_matrix:
    description: 细分或个股横向比较矩阵，要求统一口径和证据来源。
    required_fields:
      - object_type
      - object_id
      - dimension
      - score
      - evidence_ids
      - claim_ids
      - confidence
      - notes

guardrails:
  - score_is_not_trading_signal: true
  - numeric_score_requires_non_placeholder_evidence: true
  - placeholder_only_dimension_is_unscored: true
  - unscored_dimension_is_not_zero: true
  - score_aggregation_is_disabled: true
  - final_priority_is_qualitative_research_priority: true
  - high_score_requires_primary_or_high_quality_evidence: true
  - narrative_only_exposure_cannot_receive_high_score: true
  - changed_scores_require_refresh_log: true
