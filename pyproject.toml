[project]
name = "a-share-research-os"
version = "0.1.0"
description = "Evidence-first A-share equity research workspace"
requires-python = ">=3.11"
readme = "README.md"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not legacy_compatibility'"
markers = [
  "legacy_compatibility: frozen historical governance and replay compatibility checks excluded from the default suite",
]
