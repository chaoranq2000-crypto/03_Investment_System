[project]
name = "a-share-research-os"
version = "0.1.0"
description = "Evidence-first A-share equity research workspace"
requires-python = ">=3.11"
readme = "README.md"
dependencies = ["jsonschema>=4.18,<5"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not legacy_compatibility'"
markers = [
  "legacy_compatibility: explicit historical replay checks excluded from the default suite",
]
